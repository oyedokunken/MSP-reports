services:
   backend:
     build:
       context: ./backend
     working_dir: /var/www/html
     volumes:
       - ./backend:/var/www/html
     ports:
       - "8081:8081"
     environment:
       APP_ENV: local
       APP_DEBUG: "true"
       APP_URL: http://localhost:8081
       FRONTEND_URL: http://localhost:5173
       DB_CONNECTION: pgsql
       DB_HOST: postgres
       DB_PORT: 5432
       DB_DATABASE: reporting
       DB_USERNAME: postgres
       DB_PASSWORD: postgres
       CACHE_STORE: redis
       CACHE_DRIVER: redis
       SESSION_DRIVER: redis
       QUEUE_CONNECTION: redis
       REDIS_HOST: redis
       REDIS_PORT: 6379
       GOTENBERG_URL: http://gotenberg:3000
       GOTENBERG_ENABLED: "true"
     command: ["bash", "-lc", "cp -f .env.docker .env && php artisan serve --host=0.0.0.0 --port=8081"]
     depends_on:
       - postgres
       - redis
       - gotenberg

   queue-critical:
     build:
       context: ./backend
     working_dir: /var/www/html
     volumes:
       - ./backend:/var/www/html
     environment:
       APP_ENV: local
       APP_DEBUG: "true"
       APP_URL: http://localhost:8081
       FRONTEND_URL: http://localhost:5173
       DB_CONNECTION: pgsql
       DB_HOST: postgres
       DB_PORT: 5432
       DB_DATABASE: reporting
       DB_USERNAME: postgres
       DB_PASSWORD: postgres
       CACHE_STORE: redis
       CACHE_DRIVER: redis
       SESSION_DRIVER: redis
       QUEUE_CONNECTION: redis
       REDIS_HOST: redis
       REDIS_PORT: 6379
       GOTENBERG_URL: http://gotenberg:3000
       GOTENBERG_ENABLED: "true"
     command: ["bash", "-lc", "cp -f .env.docker .env && php artisan queue:work redis --queue=critical,high,sync --sleep=3 --tries=3 --max-time=3600 --timeout=600"]
     restart: unless-stopped
     deploy:
       replicas: 2
     depends_on:
       - postgres
       - redis
       - gotenberg

   queue-historical:
     build:
       context: ./backend
     working_dir: /var/www/html
     volumes:
       - ./backend:/var/www/html
     environment:
       APP_ENV: local
       APP_DEBUG: "true"
       APP_URL: http://localhost:8081
       FRONTEND_URL: http://localhost:5173
       DB_CONNECTION: pgsql
       DB_HOST: postgres
       DB_PORT: 5432
       DB_DATABASE: reporting
       DB_USERNAME: postgres
       DB_PASSWORD: postgres
       CACHE_STORE: redis
       CACHE_DRIVER: redis
       SESSION_DRIVER: redis
       QUEUE_CONNECTION: redis
       REDIS_HOST: redis
       REDIS_PORT: 6379
       GOTENBERG_URL: http://gotenberg:3000
       GOTENBERG_ENABLED: "true"
     command: ["bash", "-lc", "cp -f .env.docker .env && php artisan queue:work redis --queue=historical,default,low --sleep=3 --tries=3 --max-time=3600 --timeout=1200"]
     restart: unless-stopped
     deploy:
       replicas: 3
     depends_on:
       - postgres
       - redis
       - gotenberg

   scheduler:
     build:
       context: ./backend
     working_dir: /var/www/html
     volumes:
       - ./backend:/var/www/html
     environment:
       APP_ENV: local
       APP_DEBUG: "true"
       APP_URL: http://localhost:8081
       FRONTEND_URL: http://localhost:5173
       DB_CONNECTION: pgsql
       DB_HOST: postgres
       DB_PORT: 5432
       DB_DATABASE: reporting
       DB_USERNAME: postgres
       DB_PASSWORD: postgres
       CACHE_STORE: redis
       CACHE_DRIVER: redis
       SESSION_DRIVER: redis
       QUEUE_CONNECTION: redis
       REDIS_HOST: redis
       REDIS_PORT: 6379
       GOTENBERG_URL: http://gotenberg:3000
       GOTENBERG_ENABLED: "true"
     command: ["bash", "-lc", "cp -f .env.docker .env && php artisan schedule:work"]
     depends_on:
       - postgres
       - redis
       - gotenberg

   frontend:
     image: node:20-alpine
     working_dir: /app
     volumes:
       - ./frontend:/app
       - frontend-node-modules:/app/node_modules
     ports:
       - "5173:5173"
     environment:
       VITE_BACKEND_URL: http://localhost:8081
     command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
     depends_on:
       - backend

   # Gotenberg (PDF Generation)
   gotenberg:
     image: gotenberg/gotenberg:8
     ports:
       - "3001:3000"
     restart: unless-stopped

   postgres:
     image: postgres:16
     environment:
       POSTGRES_DB: reporting
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: postgres
     ports:
       - "5433:5432"
     volumes:
       - postgres-data:/var/lib/postgresql/data

   redis:
     image: redis:7-alpine
     ports:
       - "6380:6379"
     volumes:
       - redis-data:/data

volumes:
   postgres-data:
   redis-data:
   frontend-node-modules:
