version: '3.8'

services:
  # NGINX Web Server
  nginx:
    image: nginx:alpine
    container_name: reporting-nginx
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - reporting-network
    restart: unless-stopped

  # Laravel Application (PHP-FPM)
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
    container_name: reporting-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_DATABASE=reporting
      - DB_USERNAME=reporting_user
      - DB_PASSWORD=reporting_password
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - timescaledb
      - redis
    networks:
      - reporting-network
    restart: unless-stopped

  # TimescaleDB (PostgreSQL with time-series extension + encryption)
  timescaledb:
    build:
      context: .
      dockerfile: docker/timescaledb/Dockerfile
    container_name: reporting-timescaledb
    environment:
      - POSTGRES_DB=reporting
      - POSTGRES_USER=reporting_user
      - POSTGRES_PASSWORD=reporting_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8 --auth-host=scram-sha-256
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./docker/timescaledb/init:/docker-entrypoint-initdb.d
      - ./docker/timescaledb/scripts:/docker-scripts
      - ./docker/timescaledb/ssl:/var/lib/postgresql/ssl:ro
    networks:
      - reporting-network
    restart: unless-stopped
    # Performance tuning + SSL/TLS encryption enabled
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt
      -c ssl_key_file=/var/lib/postgresql/ssl/server.key
      -c ssl_min_protocol_version=TLSv1.2
      -c password_encryption=scram-sha-256
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_connections=on
      -c log_disconnections=on

  # Redis (Cache, Sessions, Queues)
  redis:
    image: redis:7-alpine
    container_name: reporting-redis
    volumes:
      - redis-data:/data
    networks:
      - reporting-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  # React Frontend Development Server
  frontend:
    image: node:20-alpine
    container_name: reporting-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost/api
    networks:
      - reporting-network
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # MailHog (Email Testing - Development Only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: reporting-mailhog
    networks:
      - reporting-network
    restart: unless-stopped

  # pgAdmin (Database Management - Development Only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: reporting-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@athenanetworks.com.au
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - reporting-network
    restart: unless-stopped

  # Redis Commander (Redis Management - Development Only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: reporting-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - reporting-network
    restart: unless-stopped
    depends_on:
      - redis

networks:
  reporting-network:
    driver: bridge

volumes:
  timescaledb-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local
  frontend-node-modules:
    driver: local
