stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  PHP_VERSION: "8.2"
  NODE_VERSION: "18"

# Cache configuration for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/vendor/
    - frontend/node_modules/
    - frontend/.next/

# Build Backend
build:backend:
  stage: build
  image: composer:2
  script:
    - cd backend
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - cp .env.example .env
    - php artisan key:generate
  artifacts:
    paths:
      - backend/vendor/
      - backend/.env
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Build Frontend
build:frontend:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
      - frontend/node_modules/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Test Backend
test:backend:
  stage: test
  image: php:${PHP_VERSION}-cli
  services:
    - postgres:16
    - redis:latest
  variables:
    POSTGRES_DB: reporting_test
    POSTGRES_USER: reporting
    POSTGRES_PASSWORD: secret
    DB_HOST: postgres
    REDIS_HOST: redis
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq git libpq-dev libzip-dev zip unzip
    - docker-php-ext-install pdo_pgsql zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd backend
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - cp .env.example .env
    - php artisan key:generate
    - php artisan config:clear
    - php artisan migrate --force
    - php artisan test --parallel --coverage-text --colors=never
  coverage: '/^\s*Lines:\s*\d+\.\d+\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
  only:
    - main
    - develop
    - merge_requests

# Test Frontend
test:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
    - npm run lint
    - npm run type-check
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
  only:
    - main
    - develop
    - merge_requests

# Security Scan
security:backend:
  stage: test
  image: composer:2
  script:
    - cd backend
    - composer audit
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

security:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  script:
    - cd frontend
    - npm audit --production
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Code Quality
code_quality:
  stage: test
  image: php:${PHP_VERSION}-cli
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq git zip unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd backend
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress
    - ./vendor/bin/phpcs --standard=PSR12 app/
    - ./vendor/bin/phpstan analyse app/ --level=5
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Deploy to Staging
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging server..."
    - rsync -avz --delete --exclude='.git' --exclude='node_modules' --exclude='vendor' ./ $STAGING_USER@$STAGING_SERVER:$STAGING_PATH
    - ssh $STAGING_USER@$STAGING_SERVER "cd $STAGING_PATH && ./deploy-staging.sh"
  environment:
    name: staging
    url: https://staging.reportingplatform.athenanetworks.com.au
  only:
    - develop
  when: manual

# Deploy to Production
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $PRODUCTION_SERVER >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production server..."
    - rsync -avz --delete --exclude='.git' --exclude='node_modules' --exclude='vendor' ./ $PRODUCTION_USER@$PRODUCTION_SERVER:$PRODUCTION_PATH
    - ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $PRODUCTION_PATH && ./deploy-production.sh"
  environment:
    name: production
    url: https://reportingplatform.athenanetworks.com.au
  only:
    - main
  when: manual

# Docker Build and Push
docker:build:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - tags
  when: manual
