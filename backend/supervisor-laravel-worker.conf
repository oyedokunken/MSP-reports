[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/kristian/reporting/backend/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=kristian
numprocs=2
redirect_stderr=true
stdout_logfile=/home/kristian/reporting/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
startsecs=0

[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /home/kristian/reporting/backend/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=kristian
numprocs=1
redirect_stderr=true
stdout_logfile=/home/kristian/reporting/backend/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
