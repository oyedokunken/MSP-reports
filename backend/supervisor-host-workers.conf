[program:laravel-worker-critical]
process_name=%(program_name)s_%(process_num)02d
command=php /home/mark/Music/reporting/backend/artisan queue:work redis --queue=critical,high,sync --sleep=3 --tries=3 --max-time=3600 --timeout=600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=mark
numprocs=2
redirect_stderr=true
stdout_logfile=/home/mark/Music/reporting/backend/storage/logs/worker-critical.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:laravel-worker-historical]
process_name=%(program_name)s_%(process_num)02d
command=php /home/mark/Music/reporting/backend/artisan queue:work redis --queue=historical,default,low --sleep=3 --tries=3 --max-time=3600 --timeout=1200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=mark
numprocs=3
redirect_stderr=true
stdout_logfile=/home/mark/Music/reporting/backend/storage/logs/worker-historical.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /home/mark/Music/reporting/backend/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=mark
numprocs=1
redirect_stderr=true
stdout_logfile=/home/mark/Music/reporting/backend/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
