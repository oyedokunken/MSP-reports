# =============================================================================
# MSP Reports Platform - Nginx Configuration
# =============================================================================
# This configuration serves the Laravel backend API and React frontend SPA
# from a single domain with proper routing.
#
# Installation:
#   1. Copy this file to /etc/nginx/sites-available/mspreports
#   2. Create symlink: sudo ln -s /etc/nginx/sites-available/mspreports /etc/nginx/sites-enabled/
#   3. Test config: sudo nginx -t
#   4. Reload: sudo systemctl reload nginx
#
# Variables to customize:
#   - server_name: Your domain (e.g., reports.yourcompany.com.au)
#   - root: Path to backend/public directory
#   - ssl_certificate: Path to SSL cert (for HTTPS)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name reports.example.com;  # CHANGE THIS to your domain

    # Redirect HTTP to HTTPS (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;

    # For initial setup without SSL, use this root config
    root /var/www/mspreports/backend/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/mspreports-access.log;
    error_log /var/log/nginx/mspreports-error.log;

    # Max upload size (for logo uploads, report attachments, etc.)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss application/vnd.ms-fontobject font/truetype font/opentype image/svg+xml;

    # ==========================================================================
    # API Routes - Laravel Backend
    # ==========================================================================
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sanctum CSRF cookie endpoint
    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # SAML endpoints
    location /saml {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # OAuth callback endpoints
    location /oauth {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Storage (public files like logos, generated reports)
    location /storage {
        alias /var/www/mspreports/backend/storage/app/public;
        try_files $uri =404;

        # Cache static assets
        location ~* \.(jpg|jpeg|png|gif|ico|svg|pdf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ==========================================================================
    # PHP Processing (Laravel)
    # ==========================================================================
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts for long-running requests (report generation)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ==========================================================================
    # Frontend SPA - React Application
    # ==========================================================================
    # All other routes go to the React SPA
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets from Vite build
        location ~* \.(js|css|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cache images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    # ==========================================================================
    # Security - Block sensitive files
    # ==========================================================================
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    # Block access to Laravel internals
    location ~ ^/(artisan|composer\.(json|lock)|package\.json|webpack\.mix\.js) {
        deny all;
    }
}

