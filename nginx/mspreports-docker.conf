# =============================================================================
# MSP Reports Platform - Nginx Reverse Proxy for Docker
# =============================================================================
# Serves everything on port 8081:
#   - /api/*      -> backend (Laravel) on port 8082
#   - /sanctum/*  -> backend (Laravel) on port 8082
#   - /storage/*  -> backend (Laravel) on port 8082
#   - /*          -> frontend (React)  on port 5173
#
# Customer URL: http://192.168.9.85:8081
#
# Installation:
#   sudo cp /home/mark/reporting/nginx/mspreports-docker.conf /etc/nginx/sites-available/mspreports
#   sudo ln -sf /etc/nginx/sites-available/mspreports /etc/nginx/sites-enabled/mspreports
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream backend {
    server 127.0.0.1:8082;
}

upstream frontend {
    server 127.0.0.1:5173;
}

server {
    listen 8081;
    listen [::]:8081;
    server_name 192.168.9.85;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/mspreports-access.log;
    error_log /var/log/nginx/mspreports-error.log;

    # Max upload size (logo uploads, report attachments)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/xml+rss;

    # =========================================================================
    # API Routes -> Laravel Backend Container
    # =========================================================================
    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Sanctum CSRF cookie endpoint
    location /sanctum {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SAML endpoints
    location /saml {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth callback endpoints
    location /oauth {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storage (public files like logos, generated reports)
    location /storage {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Broadcasting (WebSocket support)
    location /broadcasting {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # Frontend SPA -> React Container (Vite dev server)
    # =========================================================================
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # Security - Block sensitive files
    # =========================================================================
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }
}
